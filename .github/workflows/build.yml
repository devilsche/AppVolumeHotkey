name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/AppVolumeHotkey.Core.Tests -c Release

      - name: Version bestimmen
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $base = ([xml](Get-Content src/AppVolumeHotkey/AppVolumeHotkey.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            $v = "$base-dev.${{ github.run_number }}"
          }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          "EXE_NAME=AppVolumeHotkey-v$v.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/AppVolumeHotkey/AppVolumeHotkey.csproj -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:Version=$env:VERSION `
            -o out
          Rename-Item out/AppVolumeHotkey.exe $env:EXE_NAME

      - uses: actions/upload-artifact@v5
        with:
          name: AppVolumeHotkey-v${{ env.VERSION }}
          path: out/${{ env.EXE_NAME }}

      # Bilder aller Fenster (DE/EN, hell/dunkel) für UI-Reviews
      - name: UI-Snapshots
        shell: pwsh
        continue-on-error: true
        run: |
          # Full HD, damit Fenster nicht vom kleinen Standard-Bildschirm (1024×768) beschnitten werden
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Host "Auflösung nicht änderbar: $_" }
          Start-Sleep -Seconds 2
          $p = Start-Process -FilePath "out/$env:EXE_NAME" -ArgumentList '--ui-snapshots', "$PWD\ui-snapshots" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "Snapshots: Zeitüberschreitung" }
          Get-ChildItem ui-snapshots | Format-Table Name, Length
          if ($p.ExitCode -ne 0) { throw "Snapshots: Exitcode $($p.ExitCode)" }

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ui-snapshots-v${{ env.VERSION }}
          path: ui-snapshots
          if-no-files-found: warn

      # ---------- Microsoft-Store-Paket (MSIX, unsigniert – Microsoft signiert beim Einreichen) ----------
      - name: MSIX bauen
        shell: pwsh
        run: |
          # Store verlangt Major.Minor.Build.0
          $core = ($env:VERSION -split '-')[0]
          $parts = $core.Split('.')
          while ($parts.Count -lt 3) { $parts += '0' }
          $msixVersion = "$($parts[0]).$($parts[1]).$($parts[2]).0"
          if ("${{ github.ref_type }}" -ne "tag") { $msixVersion = "$($parts[0]).$($parts[1]).${{ github.run_number }}.0" }

          dotnet publish src/AppVolumeHotkey/AppVolumeHotkey.csproj -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=false -p:DebugType=none `
            -p:Version=$env:VERSION -o msix-layout

          Copy-Item packaging/Assets msix-layout/Assets -Recurse
          (Get-Content packaging/AppxManifest.xml -Raw).Replace('__VERSION__', $msixVersion) |
            Set-Content msix-layout/AppxManifest.xml -Encoding utf8

          $kit = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object FullName | Select-Object -Last 1
          $bin = $kit.DirectoryName
          Write-Host "Windows SDK: $bin"

          & "$bin\makepri.exe" createconfig /cf priconfig.xml /dq de-DE /o
          & "$bin\makepri.exe" new /pr msix-layout /cf priconfig.xml /of msix-layout\resources.pri /o
          if ($LASTEXITCODE -ne 0) { throw "makepri fehlgeschlagen" }

          $name = "AppVolumeHotkey-v$env:VERSION.msix"
          & "$bin\makeappx.exe" pack /d msix-layout /p "out\$name" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx fehlgeschlagen" }
          "MSIX_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v5
        with:
          name: AppVolumeHotkey-v${{ env.VERSION }}-msix
          path: out/${{ env.MSIX_NAME }}

      - name: Patch Notes aus CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = [regex]::Escape($env:VERSION)
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## \[$v\][^\n]*\n(.*?)(?=^## \[|\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Siehe / see CHANGELOG.md" }
          Set-Content release-notes.md $notes -Encoding utf8

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/${{ env.EXE_NAME }}
            out/${{ env.MSIX_NAME }}
          body_path: release-notes.md
