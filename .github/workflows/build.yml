name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/AppVolumeHotkey.Core.Tests -c Release

      - name: Version bestimmen
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $base = ([xml](Get-Content src/AppVolumeHotkey/AppVolumeHotkey.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            $v = "$base-dev.${{ github.run_number }}"
          }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          "EXE_NAME=AppVolumeHotkey-v$v.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/AppVolumeHotkey/AppVolumeHotkey.csproj -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:Version=$env:VERSION `
            -o out
          Rename-Item out/AppVolumeHotkey.exe $env:EXE_NAME

      - uses: actions/upload-artifact@v5
        with:
          name: AppVolumeHotkey-v${{ env.VERSION }}
          path: out/${{ env.EXE_NAME }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ env.EXE_NAME }}
          generate_release_notes: true
